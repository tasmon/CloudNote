<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Note</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="page-header">Note</header>

  <section id="app">
    <span class="field-label">Title</span>
    <input id="note-title" type="text" maxlength="60" placeholder="Note title">

    <span class="field-label">Note</span>
    <textarea id="note-body" placeholder="Write your note here..."></textarea>
  </section>

  <footer>
    <span id="softkey-left" class="softkey"></span>
    <span id="softkey-center" class="softkey"></span>
    <span id="softkey-right" class="softkey"></span>
  </footer>

  <script src="app.js"></script>
  <script>
    setupCommon();

    var params = new URLSearchParams(window.location.search);
    var noteId = params.get('id');
    var existing = noteId ? getNoteById(noteId) : null;
    var isNew = !existing;

    var titleEl = document.getElementById('note-title');
    var bodyEl = document.getElementById('note-body');
    var headerEl = document.getElementById('page-header');

    var initialTitle = existing ? (existing.title || '') : '';
    var initialBody = existing ? (existing.body || '') : '';

    titleEl.value = initialTitle;
    bodyEl.value = initialBody;
    headerEl.textContent = isNew ? 'New Note' : 'Edit Note';

    function isDirty() {
      return titleEl.value !== initialTitle || bodyEl.value !== initialBody;
    }

    function hasContent() {
      return titleEl.value.trim().length > 0 || bodyEl.value.trim().length > 0;
    }

    function saveAndExit() {
      if (!hasContent()) {
        window.location.href = 'index.html';
        return;
      }
      var note = existing || { id: uid(), createdAt: nowTs() };
      note.title = titleEl.value.trim();
      note.body = bodyEl.value;
      note.updatedAt = nowTs();
      upsertNote(note);
      window.location.href = 'index.html';
    }

    function confirmDiscard() {
      if (!isDirty()) {
        window.location.href = 'index.html';
        return;
      }
      showModal('Discard unsaved changes?', [
        { label: 'Cancel' },
        { label: 'Discard', primary: true, action: function () { window.location.href = 'index.html'; } }
      ]);
    }

    function openMenu() {
      var menuItems = [
        { label: 'Save', action: saveAndExit }
      ];
      if (!isNew) {
        menuItems.push({
          label: 'Delete Note',
          danger: true,
          action: function () {
            showModal('Delete this note? This cannot be undone.', [
              { label: 'Cancel' },
              {
                label: 'Delete', primary: true, action: function () {
                  deleteNote(existing.id);
                  window.location.href = 'index.html';
                }
              }
            ]);
          }
        });
      }
      menuItems.push({ label: 'Cancel', action: confirmDiscard });
      showOptionsMenu(menuItems);
    }

    bindLeftSoftKey(openMenu, 'Menu');
    bindCenterSoftKey(saveAndExit, 'Save');
    bindRightSoftKeyGuarded(confirmDiscard, 'Back');
  </script>
</body>
</html>
