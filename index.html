<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CloudStopwatch</title>
  <meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="time">00:00:000</h1>
  </header>

  <!-- Stopwatch Page -->
  <section id="stopwatch" class="page active card">
    <button onclick="startPause()">5 • Start/Pause</button>
    <button onclick="reset()">1 • Reset</button>
    <button onclick="lap()">0 • Lap</button>
    <div id="laps"></div>
  </section>

  <!-- Settings Page -->
  <section id="settings" class="page card">
    <h2>* • Settings</h2>
    <label>Time Format:
      <select onchange="setFormat(this.value)">
        <option value="ms">MM:SS:MS</option>
        <option value="hms">HH:MM:SS:MS</option>
      </select>
    </label><br>
    <label><input type="checkbox" id="sound" onchange="toggleSound()"> Sound</label><br>
    <label><input type="checkbox" id="autosave" onchange="toggleAutoSave()"> Auto Save</label>
  </section>

  <!-- Help Page -->
  <section id="help" class="page card">
    <h2>Help</h2>
    <ul>
      <li>1 → Reset</li>
      <li>5 → Start/Pause</li>
      <li>0 → Lap</li>
      <li>* → Settings</li>
    </ul>
  </section>

  <!-- About Page -->
  <section id="about" class="page card">
    <h2>About</h2>
    <p>CloudStopwatch<br>
       Version: 2.0.10<br>
       Developer: Tasmon</p>
  </section>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav">
    <button onclick="showPage('stopwatch')">Stopwatch</button>
    <button onclick="showPage('settings')">Settings</button>
    <button onclick="showPage('help')">Help</button>
    <button onclick="showPage('about')">About</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
